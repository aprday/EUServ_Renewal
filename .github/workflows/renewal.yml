name: EUserv Auto Renewal

on:
  schedule:
    # 每月 6 号到月底，每天北京时间 20:00（UTC 12:00）检查一次；
    # 续期成功写入 renewed_YYYY-MM.txt 后，后续运行会直接跳过。
    - cron: '0 12 6-31 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: euserv-daily-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip if already renewed this month
        id: renewal-window
        run: |
          MARKER="renewed_$(date -u +%Y-%m).txt"
          if [ -f "$MARKER" ]; then
            echo "✅ 本月已续期，跳过本次运行"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "本月尚未续期，继续检查"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.renewal-window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.renewal-window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EUserv renew script
        if: steps.renewal-window.outputs.should_run == 'true'
        env:
          EUSERV_EMAIL: ${{ secrets.EUSERV_USERNAME }}
          EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
          EMAIL_PIN: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          CAPTCHA_USERID: ${{ secrets.CAPTCHA_USERID }}
          CAPTCHA_APIKEY: ${{ secrets.CAPTCHA_APIKEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_USER_ID }}
          TG_API_HOST: ${{ secrets.TG_API_HOST }}
        run: python euserv_renew.py

      - name: Keep repository schedule alive
        if: always()
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt renewed_*.txt
          git commit -m "chore: keep alive $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
