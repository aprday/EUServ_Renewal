name: EUserv Auto Renewal

on:
  schedule:
    # 每天北京时间 20:00 做本地日期判断；仅进入合同续期窗口后才登录 EUserv。
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: euserv-daily-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check renewal window
        id: renewal-window
        run: |
          CURRENT_DATE="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          CURRENT_MONTH="${CURRENT_DATE:0:7}"
          RENEWED_MARKER="renewed_${CURRENT_MONTH}.txt"
          STOPPED_MARKER="stopped_${CURRENT_MONTH}.txt"
          REPAIR_RESULT="$(python3 tools/repair_state.py 2>&1 || true)"
          echo "$REPAIR_RESULT"
          if echo "$REPAIR_RESULT" | grep -q '^repaired'; then
            echo "state_repaired=true" >> "$GITHUB_OUTPUT"
          fi
          NEXT_DATE="$(python -c "import json, pathlib; p=pathlib.Path('renewal_state.json'); print(json.loads(p.read_text(encoding='utf-8')).get('next_renewal_date', '') if p.exists() else '')" 2>/dev/null || true)"
          STATE_STATUS="$(python -c "import json, pathlib; p=pathlib.Path('renewal_state.json'); print(json.loads(p.read_text(encoding='utf-8')).get('status', 'waiting') if p.exists() else 'waiting')" 2>/dev/null || true)"
          WINDOW_START="$(NEXT_DATE="$NEXT_DATE" python -c "import os; from datetime import datetime, timedelta; value=os.environ.get('NEXT_DATE', ''); print((datetime.strptime(value, '%Y-%m-%d').date()-timedelta(days=3)).isoformat() if value else '')" 2>/dev/null || true)"
          if [ -z "$STATE_STATUS" ]; then STATE_STATUS="waiting"; fi
          echo "due_date=$NEXT_DATE" >> "$GITHUB_OUTPUT"

          if [ "$STATE_STATUS" = "stopped" ]; then
            echo "上一续期轮次已停止，需人工处理 renewal_state.json 后才能恢复"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$WINDOW_START" ] && [[ "$CURRENT_DATE" < "$WINDOW_START" ]]; then
            echo "下次可续期日期为 $NEXT_DATE，检查窗口从 $WINDOW_START 开始，跳过登录"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ -f "$RENEWED_MARKER" ]; then
            echo "本轮已续期成功，跳过登录"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ -f "$STOPPED_MARKER" ]; then
            echo "本轮已在合同可续期日停止重试，跳过登录"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "进入合同续期检查窗口：$WINDOW_START 至 $NEXT_DATE"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.renewal-window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.renewal-window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EUserv renew script
        if: steps.renewal-window.outputs.should_run == 'true'
        env:
          EUSERV_EMAIL: ${{ secrets.EUSERV_USERNAME }}
          EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
          EUSERV_ORDER_IDS: ${{ secrets.EUSERV_ORDER_IDS }}
          EMAIL_PIN: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          CAPTCHA_USERID: ${{ secrets.CAPTCHA_USERID }}
          CAPTCHA_APIKEY: ${{ secrets.CAPTCHA_APIKEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_USER_ID }}
          TG_API_HOST: ${{ secrets.TG_API_HOST }}
          RENEWAL_DUE_DATE: ${{ steps.renewal-window.outputs.due_date }}
        run: python euserv_renew.py

      - name: Notify state file repaired
        if: steps.renewal-window.outputs.state_repaired == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_USER_ID }}
          TG_API_HOST: ${{ secrets.TG_API_HOST }}
        run: |
          API="${TG_API_HOST:-https://api.telegram.org}"
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then echo "未配置 Telegram，跳过推送"; exit 0; fi
          curl -s -X POST "$API/bot$TG_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT_ID" \
            --data-urlencode "text=⚠️ EUserv 系统提示：renewal_state.json 已损坏并被自动修复重置，本次运行将按合同页面自愈续期日期。" \
            --max-time 20 || true

      - name: Notify workflow failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_USER_ID }}
          TG_API_HOST: ${{ secrets.TG_API_HOST }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f .crash_notified ]; then echo "脚本已自行推送崩溃通知，跳过重复推送"; exit 0; fi
          API="${TG_API_HOST:-https://api.telegram.org}"
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then echo "未配置 Telegram，跳过推送"; exit 0; fi
          curl -s -X POST "$API/bot$TG_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT_ID" \
            --data-urlencode "text=⚠️ EUserv 系统错误：续期工作流发生系统级失败（环境/闸门/依赖等），本次未执行续期。日志: $RUN_URL" \
            --max-time 20 || true

      - name: Keep repository schedule alive
        if: always()
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          find . -maxdepth 1 -name 'renewed_*.txt' -print0 | xargs -0 -r git add --
          find . -maxdepth 1 -name 'stopped_*.txt' -print0 | xargs -0 -r git add --
          [ ! -f renewal_state.json ] || git add renewal_state.json
          git commit -m "chore: keep alive $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
