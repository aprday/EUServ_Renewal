name: EUserv Auto Renewal

on:
  schedule:
    # 每月 6 至 9 日，北京时间 20:00（UTC 12:00）检查一次。
    - cron: '0 12 6-9 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: euserv-daily-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check renewal window
        id: renewal-window
        run: |
          CURRENT_MONTH="$(TZ=Asia/Shanghai date +%Y-%m)"
          CURRENT_DAY="$(TZ=Asia/Shanghai date +%d)"
          RENEWED_MARKER="renewed_${CURRENT_MONTH}.txt"
          STOPPED_MARKER="stopped_${CURRENT_MONTH}.txt"
          NEXT_DATE="$(python -c "import json, pathlib; p=pathlib.Path('renewal_state.json'); print(json.loads(p.read_text(encoding='utf-8')).get('next_renewal_date', '') if p.exists() else '')")"
          STATE_STATUS="$(python -c "import json, pathlib; p=pathlib.Path('renewal_state.json'); print(json.loads(p.read_text(encoding='utf-8')).get('status', 'waiting') if p.exists() else 'waiting')")"
          NEXT_MONTH="${NEXT_DATE:0:7}"

          if [ "$STATE_STATUS" = "stopped" ]; then
            echo "上一续期轮次已停止，需人工处理 renewal_state.json 后才能恢复"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT_DAY" -lt 6 ] || [ "$CURRENT_DAY" -gt 9 ]; then
            echo "当前不在每月 6 至 9 日检查窗口，跳过登录"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$NEXT_MONTH" ] && [[ "$CURRENT_MONTH" < "$NEXT_MONTH" ]]; then
            echo "下次可续期日期为 $NEXT_DATE，本月跳过登录"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ -f "$RENEWED_MARKER" ]; then
            echo "本轮已续期成功，跳过登录"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ -f "$STOPPED_MARKER" ]; then
            echo "本轮已在 9 日停止重试，跳过登录"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "进入本月 6 至 9 日续期检查窗口"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.renewal-window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.renewal-window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EUserv renew script
        if: steps.renewal-window.outputs.should_run == 'true'
        env:
          EUSERV_EMAIL: ${{ secrets.EUSERV_USERNAME }}
          EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
          EUSERV_ORDER_IDS: ${{ secrets.EUSERV_ORDER_IDS }}
          EMAIL_PIN: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          CAPTCHA_USERID: ${{ secrets.CAPTCHA_USERID }}
          CAPTCHA_APIKEY: ${{ secrets.CAPTCHA_APIKEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_USER_ID }}
          TG_API_HOST: ${{ secrets.TG_API_HOST }}
          RENEWAL_STOP_DAY: '9'
        run: python euserv_renew.py

      - name: Keep repository schedule alive
        if: always()
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          find . -maxdepth 1 -name 'renewed_*.txt' -print0 | xargs -0 -r git add --
          find . -maxdepth 1 -name 'stopped_*.txt' -print0 | xargs -0 -r git add --
          [ ! -f renewal_state.json ] || git add renewal_state.json
          git commit -m "chore: keep alive $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
