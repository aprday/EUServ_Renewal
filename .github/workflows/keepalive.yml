# wimdaw/EUServ_Renewal 保活 workflow
# 作用：定期对 keepalive 分支做空 commit，刷新仓库活跃度，
#       防止 GitHub 的 60 天无提交规则停用本仓库所有 schedule 定时任务。
# 触发：schedule 每月15日一次（60 天规则下足够），也可手动触发。
# 隔离：只操作 keepalive 分支，不动 main，不影响原 workflow。
# 通知：保活结果推送到 Telegram。
name: Keepalive

on:
  schedule:
    - cron: '0 3 15 * *'   # 每月15日凌晨3点（间隔28-31天，远低于60天上限）
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write           # 只需写 keepalive 分支

concurrency:
  group: keepalive
  cancel-in-progress: false   # 避免并发推空 commit

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout keepalive branch
        uses: actions/checkout@v4
        with:
          ref: keepalive

      - name: Push empty commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push origin keepalive

      - name: Send Telegram notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_USER_ID" ]; then
            echo "⚠️ TG secrets 未配置，跳过通知"
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            ICON="✅"
          else
            ICON="❌"
          fi
          DATE="$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          curl -s -m 20 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_USER_ID}" \
            --data-urlencode "text=${ICON} EUServ_Renewal 保活通知 (${DATE})" \
            || echo "TG 通知失败"